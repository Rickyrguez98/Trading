[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-selection"
version = "0.1.0"
description = "Trading research toolkit (free data): U.S.-equity asset selection and intraday binary-options directional signals."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ricardo Rodriguez", email = "if722544@iteso.mx" }]
keywords = ["quant", "equities", "asset-selection", "binary-options", "intraday", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "requests>=2.28",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "yfinance>=0.2.40",
    "vaderSentiment>=3.3.2",
    "tenacity>=8.2",
    "tqdm>=4.65",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.7",
    "types-PyYAML",
]
finbert = [
    # Optional: heavy. Install only if you want FinBERT-based sentiment.
    "torch>=2.1",
    "transformers>=4.40",
]

[project.scripts]
# Canonical domain commands
trading-us-equities = "asset_selection.pipelines.run_asset_selection:main"
trading-binary-options = "binary_options_selection.pipelines.run_binary_options_selection:main"
trading-portfolio = "asset_selection.pipelines.run_portfolio_allocation:main"
# Legacy aliases (kept for backward compatibility)
asset-selection = "asset_selection.pipelines.run_asset_selection:main"
binary-options-selection = "binary_options_selection.pipelines.run_binary_options_selection:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Enforced baseline: syntax errors + full pyflakes correctness rules. Style
# modernization families (I, B, UP, E, W) are advisory for the legacy modules
# and tracked in the roadmaps; run them locally with `ruff check --select ...`.
select = ["E9", "F"]
ignore = ["E501"]
