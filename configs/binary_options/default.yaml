# Binary Options Selection — default configuration
#
# Research signals only: CALL / PUT / NO_TRADE per (asset x expiration horizon).
# No execution, no broker connectivity, no stake sizing. Scores are transparent
# heuristics, NOT calibrated probabilities (see docs/BINARY_OPTIONS_METHODOLOGY.md).
#
# Every threshold here materially affects a signal and is documented in
# docs/BINARY_OPTIONS_METHODOLOGY.md. The loader rejects impossible values
# (unsupported intervals, horizons outside 5-120 minutes, weight structures
# that let one family dominate, contradictory session settings, ...).

run:
  top_n: 20
  output_dir: reports/binary_options
  processed_dir: data/binary_options/processed

universe:
  # "custom"          -- the explicit `tickers` list (or --tickers on the CLI)
  # "watchlist"       -- the configured `watchlist` (or --watchlist file); DEFAULT.
  # "asset-selection" -- consume the equity pipeline's output CSV as an upstream
  #                      universe/quality filter. A strong fundamental score is
  #                      NOT treated as a predictor of 5-minute direction.
  mode: watchlist
  tickers: []
  watchlist: [AAPL, MSFT, NVDA, SPY]
  watchlist_file: null
  asset_selection_input: data/us_equities/processed/asset_selection_results.csv
  asset_selection_top_k: 25
  max_symbols: 50
  # Benchmark for market-context features (fetched alongside the universe).
  benchmark_symbol: SPY

horizons:
  # Expiration horizons in minutes. Allowed range: 5-120.
  #   5-15  inclusive -> "short_term" horizon group
  #   30-120          -> "extended_intraday" group (still intraday analysis,
  #                      NOT long-term investing; 30m is extended by product
  #                      definition)
  # Every (asset, horizon) pair gets its own features, score, and signal.
  minutes: [5, 10, 15, 30, 60, 90, 120]

candles:
  # Provider-native interval. Supported: 1m, 2m, 5m, 15m, 30m, 60m/1h.
  # Coarse data is NEVER resampled into a finer interval, and daily data is
  # never presented as intraday. Every horizon must be a whole multiple of
  # this interval.
  interval: 5m
  required_history_bars: 60     # bars needed before features are trusted
  fetch_history_bars: 120       # bars requested (headroom for gaps)
  # Latest-candle age beyond (max_staleness_intervals * interval) -> the data
  # is stale and live signals become NO_TRADE (STALE_DATA).
  max_staleness_intervals: 3.0
  # An in-progress candle is dropped unless explicitly enabled (research replays).
  allow_incomplete_last_candle: false

market_session:
  timezone: America/New_York
  regular_open: "09:30"
  regular_close: "16:00"
  premarket_open: "04:00"
  afterhours_close: "20:00"
  # "regular" restricts analysis to regular hours. Enabling premarket/afterhours
  # requires session: extended (validated -- contradictory settings are rejected).
  session: regular
  allow_premarket: false
  allow_afterhours: false
  # When the market is not in an allowed session, signals become NO_TRADE
  # (MARKET_CLOSED) rather than pretending the tape is live.
  require_open_market: true

providers:
  intraday: yfinance          # default free provider (delayed; documented limits)
  priority: []                # ordered fallback chain; only implemented providers

cache:
  enabled: true
  dir: data/binary_options/cache
  # Interval-aware TTL: ttl = clamp(interval_seconds * fraction, min, max).
  # Intraday data must never inherit multi-day cache assumptions.
  ttl_interval_fraction: 0.5
  min_ttl_seconds: 15
  max_ttl_seconds: 900

rate_limits:
  yfinance: 0.4               # min seconds between calls

liquidity:
  min_avg_volume: 10000            # shares per bar (rolling mean)
  min_avg_dollar_volume: 250000    # close * volume per bar
  max_zero_volume_ratio: 0.20      # bars with zero volume / total bars

data_quality:
  max_missing_ratio: 0.10          # missing bars / expected bars
  max_duplicate_ratio: 0.02
  min_price: 1.0
  # Single-bar |return| above this is flagged as abnormal (possible bad print).
  max_abnormal_bar_return: 0.20
  # Rows below this data-quality score (0-100) cannot carry a live signal.
  min_data_quality_score: 60

features:
  # Windows are in BARS. Momentum lookbacks scale with the horizon:
  # window = horizon_bars * multiple, so a 5m and a 120m signal genuinely
  # measure different things (formulas in docs/BINARY_OPTIONS_METHODOLOGY.md).
  return_window_multiples: [1, 3, 6]
  ema_fast_bars: 9
  ema_slow_bars: 21
  macd_fast_bars: 12
  macd_slow_bars: 26
  macd_signal_bars: 9
  rsi_period_bars: 14
  bollinger_period_bars: 20
  bollinger_k: 2.0
  rsi_overbought: 70
  rsi_oversold: 30
  atr_period_bars: 14
  range_window_bars: 20
  compression_range_ratio: 0.5
  expansion_range_ratio: 2.0
  abnormal_range_multiple: 5.0
  volume_window_bars: 20
  high_relative_volume: 1.5
  context_return_window_multiples: [1, 3]

weights:
  # Relative feature-family weights per horizon group (renormalized over the
  # families actually available). Validation enforces: no non-sentiment family
  # above 60% of the total; sentiment capped at 5% (short_term) / 15% (extended) so
  # stale, broad news tone can never override live price/volume evidence.
  short_term:                  # 5-15 minute horizons
    momentum: 0.30
    trend: 0.20
    mean_reversion: 0.15
    volume: 0.20
    context: 0.15
    sentiment: 0.00
  extended_intraday:           # 30-120 minute horizons (still intraday)
    momentum: 0.20
    trend: 0.30
    mean_reversion: 0.10
    volume: 0.15
    context: 0.20
    sentiment: 0.05

signal_rules:
  # |directional_score| (0-100) below this -> NO_TRADE (SCORES_TOO_CLOSE).
  min_directional_margin: 15
  # confidence_score (0-1, heuristic, NOT a probability) below this -> NO_TRADE.
  min_confidence: 0.25
  # min(call,put)/max(call,put) above this -> NO_TRADE (CONTRADICTORY_EVIDENCE).
  max_contradiction_ratio: 0.60
  contradiction_penalty_weight: 0.50
  # Strength bands (both conditions required for "strong").
  strong_min_directional: 40
  strong_min_confidence: 0.50
  moderate_min_directional: 25
  # Confidence multiplier floor under abnormal volatility regimes.
  vol_regime_floor: 0.50

sentiment:
  # Optional and strictly secondary. Only source in this milestone: the equity
  # pipeline's sentiment_score (universe mode "asset-selection"). Applies only
  # to horizons >= min_horizon_minutes; weight capped by validation.
  enabled: false
  min_horizon_minutes: 60
  max_abs_tilt: 25

payout:
  # Net win per unit staked for a binary contract (e.g. 0.85). When set, the
  # break-even win probability p* = 1 / (1 + payout_ratio) is reported as
  # CONTEXT ONLY. Confidence scores are not probabilities, so no expected
  # value / edge is computed in this milestone. null = not configured.
  payout_ratio: null

robustness:
  allow_partial_results: true
  max_provider_failure_ratio: 0.50
  health_check_symbols: [SPY, AAPL]
  run_health_check: true

logging:
  level: INFO
  log_to_file: false
  file: logs/binary_options_selection.log

validation:
  enabled: true
